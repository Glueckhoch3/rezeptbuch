server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. No inline scripts/styles are used, so the CSP stays
    # strict; connect-src 'self' covers the same-origin /api/ proxy below.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API calls to the backend service on the Docker network.
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Single-page app fallback: send all other routes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
